plugins {
    id 'com.android.application'
}

/**
 * versionName / versionCode.
 *
 * Deliberately independent of git tags: this ships as an APK the user installs
 * directly, so the version must move on every build or Android refuses the
 * upgrade ("app not installed").
 *
 * versionCode = major*10000 + minor*100 + patch (monotonic).
 */
def versionNameValue = project.hasProperty('versionName') ? project.property('versionName') : '1.0.0'
def versionCodeValue = project.hasProperty('versionCode')
        ? project.property('versionCode').toInteger()
        : { ->
            def m = versionNameValue =~ /^v?(\d+)\.(\d+)\.(\d+)$/
            if (!m.matches()) return 1
            return (m[0][1] as int) * 10000 + (m[0][2] as int) * 100 + (m[0][3] as int)
        }()

android {
    namespace 'com.clawterm.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.clawterm.app"
        minSdk 24
        targetSdk 34
        versionCode versionCodeValue
        versionName versionNameValue
    }

    signingConfigs {
        release {
            // A checked-in keystore so a locally built APK can be installed and
            // upgraded without the user generating keys. CI can override all
            // four values via environment variables.
            def ks = System.getenv("KEYSTORE_FILE")
            storeFile ks ? file(ks) : file('clawterm.jks')
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: 'clawterm123'
            keyAlias System.getenv("KEY_ALIAS") ?: 'clawterm'
            keyPassword System.getenv("KEY_PASSWORD") ?: 'clawterm123'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            debuggable true
            applicationIdSuffix '.debug'
        }
    }

    applicationVariants.all { variant ->
        if (variant.buildType.name == 'release') {
            variant.outputs.all { outputFileName = "clawterm-android.apk" }
        } else if (variant.buildType.name == 'debug') {
            variant.outputs.all { outputFileName = "clawterm-android-debug.apk" }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'com.google.android.material:material:1.11.0'
    // Pure-Java SSH client: no NDK, no native library, no separate process.
    implementation 'com.github.mwiede:jsch:0.2.16'
    // WebViewAssetLoader: serves the bundled UI over an https:// origin backed
    // by the APK's assets. Without it the page would load from file://, where
    // ES modules are blocked by CORS and the app renders a blank screen.
    implementation 'androidx.webkit:webkit:1.12.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test:core:1.5.0'
}
